[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[template.environment]
  HEYSO_SETUP_KEY = "设置至少 32 位的部署初始化密钥，首次打开页面时使用"
